spring.application.name=prisma-api-isolated-test
spring.config.import=
# Fail closed if a test starts without LocalPostgresTest's dynamic connection properties.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/prisma_missing_local_fixture
spring.datasource.username=prisma_local_test_only
spring.datasource.password=prisma_local_test_only
spring.flyway.url=jdbc:postgresql://127.0.0.1:1/prisma_missing_local_fixture
spring.flyway.user=prisma_local_test_only
spring.flyway.password=prisma_local_test_only
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.connect-retries=0
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
logging.level.io.zonky.test.db.postgres.embedded=warn
logging.level.org.hibernate.SQL=warn
