# =====================================================================
# Perfil: PRODUCCIÓN (prod) - Para Neon Tech Cloud
# =====================================================================

# En producción no hay valores por defecto: se exigen variables de entorno
# La URL de la aplicación debe incluir ?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway se conecta directamente (sin pgbouncer/transaction pooler) para soportar advisory locks
spring.flyway.url=${DB_FLYWAY_URL:${DB_URL}}
spring.flyway.user=${DB_FLYWAY_USER:${DB_USER}}
spring.flyway.password=${DB_FLYWAY_PASSWORD:${DB_PASSWORD}}

# Pool HikariCP optimizado para producción
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# En producción se oculta el SQL de la consola para proteger datos y optimizar I/O
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Clave secreta obligatoria inyectada por variable de entorno
jwt.secret=${JWT_SECRET}
