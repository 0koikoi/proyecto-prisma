# =====================================================================
# Perfil: PRUEBAS (test) - Conecta a la rama 'test' en Neon Tech
# =====================================================================

# Credenciales de BD para testing (inyectables desde .env como DB_TEST_URL o fallback a DB_URL)
spring.datasource.url=${DB_TEST_URL:${DB_URL}}
spring.datasource.username=${DB_TEST_USER:${DB_USER}}
spring.datasource.password=${DB_TEST_PASSWORD:${DB_PASSWORD}}

# Flyway en testing
spring.flyway.url=${DB_TEST_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${DB_TEST_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${DB_TEST_FLYWAY_PASSWORD:${spring.datasource.password}}

# Pool ligero para tests
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Ocultar verbose de Hibernate en tests a menos que se requiera
spring.jpa.show-sql=false

# Clave JWT de pruebas fija
jwt.secret=prisma_test_secret_key_fixed_for_ci_cd_and_local_unit_tests_2026
