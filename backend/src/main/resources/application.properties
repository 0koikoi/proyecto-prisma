# =============================================================================
# CONFIGURACIÓN TIENDA PRISMA - SPRING BOOT (BACKOFFICE API)
# RESPONSABLE: Todos los integrantes (Coordinado por Keila)
# =============================================================================

spring.application.name=prisma-api
server.port=8080

# --- Base de Datos PostgreSQL (Desarrollo local Docker o Neon en la nube) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prisma_db}
spring.datasource.username=${DB_USER:prisma_user}
spring.datasource.password=${DB_PASSWORD:prisma_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Configuración de Seguridad y JWT ---
# TODO Keila: Definir el secret key y tiempo de expiración (24 horas)
jwt.secret=${JWT_SECRET:prisma_secret_key_very_secure_2026_super_safe_huanuco}
jwt.expiration-ms=86400000
