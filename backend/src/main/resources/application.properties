spring.application.name=prisma-api
server.port=8080

# Perfil activo (por defecto 'dev' para desarrollo local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Carga automática nativa de .env (tanto si se ejecuta desde backend/ o desde la raíz)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]


# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA común
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración Flyway común
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=true
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5s

# Parámetros base de JWT
jwt.expiration-ms=86400000
