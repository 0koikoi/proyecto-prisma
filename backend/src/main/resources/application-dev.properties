# =====================================================================
# Perfil: DESARROLLO (dev) - Para uso local o conexión a rama Neon dev
# =====================================================================

# Credenciales de BD (con valores por defecto para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prisma_db}
spring.datasource.username=${DB_USER:prisma_user}
spring.datasource.password=${DB_PASSWORD:prisma_password}

# Flyway en desarrollo
spring.flyway.url=${DB_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${DB_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${DB_FLYWAY_PASSWORD:${spring.datasource.password}}

# Pool HikariCP ligero para desarrollo
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Logs SQL para depuración en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave secreta para pruebas locales
jwt.secret=${JWT_SECRET:prisma_dev_secret_key_safe_for_local_testing_only_2026_super_safe}
