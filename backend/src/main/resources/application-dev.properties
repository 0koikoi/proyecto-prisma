# =====================================================================
# Perfil: DESARROLLO (dev) - Para uso local o conexión a rama Neon dev
# =====================================================================

# Credenciales de BD (inyectadas desde .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway en desarrollo (usa la misma conexión de BD por defecto)
spring.flyway.url=${DB_FLYWAY_URL:${DB_URL}}
spring.flyway.user=${DB_FLYWAY_USER:${DB_USER}}
spring.flyway.password=${DB_FLYWAY_PASSWORD:${DB_PASSWORD}}

# Pool HikariCP ligero para desarrollo
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Logs SQL para depuración en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave secreta para firma JWT (definir en el archivo .env local)
jwt.secret=${JWT_SECRET}
